D.rows.forEach(r=>{r.st='Não Superia (prospect)';r.ctnr=r.kg/24000;});
const SEL={cli:new Set(),uf:new Set(),cid:new Set(),ncm:new Set(),comp:new Set()};
let sK='kg',sD=-1;
function effKg(r){if(!SEL.ncm.size)return r.kg;let s=0;for(const n of r.ncms)if(SEL.ncm.has(n[0]))s+=n[1];return s;}
function effNcms(r){return SEL.ncm.size?r.ncms.filter(n=>SEL.ncm.has(n[0])):r.ncms;}

function fmtNcm(o){const m=/^(.*) (\(\d{5,}\))$/.exec(o);return m?`<span class="nm">${m[1]}</span><span class="cd">${m[2]}</span>`:`<span class="nm">${o}</span>`;}
function ms(hostId,label,opts,selSet,onChange,optFmt){
  const host=document.getElementById(hostId);
  const lb=()=>label+(selSet.size?' ('+selSet.size+')':': todos');
  host.innerHTML='<button type="button" class="msb"></button><div class="msp"><input class="s" placeholder="buscar..."><div class="msact"><a data-a="all">todos</a><a data-a="none">limpar</a></div><div class="opts"></div></div>';
  const btn=host.querySelector('.msb'),pan=host.querySelector('.msp'),optbox=host.querySelector('.opts'),sinp=host.querySelector('.s');
  const render1=o=>`<label><input type="checkbox" value="${o.replace(/"/g,'&quot;')}" ${selSet.has(o)?'checked':''}>${optFmt?optFmt(o):'<span class="nm">'+o+'</span>'}</label>`;
  btn.textContent=lb();
  function draw(f){optbox.innerHTML=opts.filter(o=>!f||o.toLowerCase().includes(f)).map(render1).join('')||'<div class="cmp" style="padding:6px">sem resultados</div>';}
  draw('');
  btn.onclick=e=>{e.stopPropagation();document.querySelectorAll('.msp.open').forEach(p=>{if(p!==pan)p.classList.remove('open')});pan.classList.toggle('open');};
  pan.onclick=e=>e.stopPropagation();
  sinp.oninput=()=>draw(sinp.value.toLowerCase());
  optbox.onchange=e=>{const v=e.target.value;if(e.target.checked)selSet.add(v);else selSet.delete(v);btn.textContent=lb();onChange();};
  host.querySelector('[data-a="all"]').onclick=()=>{opts.filter(o=>!sinp.value||o.toLowerCase().includes(sinp.value.toLowerCase())).forEach(o=>selSet.add(o));draw(sinp.value.toLowerCase());btn.textContent=lb();onChange();};
  host.querySelector('[data-a="none"]').onclick=()=>{selSet.clear();draw(sinp.value.toLowerCase());btn.textContent=lb();onChange();};
}
document.addEventListener('click',()=>document.querySelectorAll('.msp.open').forEach(p=>p.classList.remove('open')));

function filtered(){
  const q=document.getElementById('q').value.toLowerCase();
  return D.rows.filter(r=>
    (!q||r.c.toLowerCase().includes(q))&&
    (!SEL.cli.size||SEL.cli.has(r.c))&&
    (!SEL.uf.size||SEL.uf.has(r.uf))&&
    (!SEL.cid.size||SEL.cid.has(r.city))&&
    (!SEL.ncm.size||r.ncms.some(n=>SEL.ncm.has(n[0])))&&
    (!SEL.comp.size||r.exp.some(e=>SEL.comp.has(e[0])))
  );
}
function render(){
  let r=filtered().map(x=>({x,vol:effKg(x)}));
  const numK=(sK==='kg'||sK==='ctnr');
  r.sort((A,B)=>{let x=numK?A.vol:A.x[sK],y=numK?B.vol:B.x[sK];if(typeof x==='string'){x=(x||'').toLowerCase();y=(y||'').toLowerCase();}return x<y?-sD:x>y?sD:0;});
  const tot=r.reduce((s,o)=>s+o.vol,0),ctnr=tot/24000,avg=r.length?tot/r.length:0;
  const ncmOn=SEL.ncm.size>0;
  document.getElementById('sums').innerHTML=
    `<div class="sumc"><div class="l">Clientes no filtro</div><div class="v">${fmt(r.length)}</div><div class="d">de ${fmt(D.n)} prospects</div></div>`+
    `<div class="sumc"><div class="l">${ncmOn?'Volume na(s) NCM(s) (t)':'Mercado (t)'}</div><div class="v">${fmt(Math.round(tot/1000))}</div><div class="d">${ncmOn?'ajustado à(s) NCM(s) selecionada(s)':'volume 12 meses não atendido'}</div></div>`+
    `<div class="sumc"><div class="l">Containers (ctnr)</div><div class="v red">${fmt(ctnr)}</div><div class="d">1 ctnr = 24 t</div></div>`+
    `<div class="sumc"><div class="l">Média por cliente</div><div class="v">${fmt(Math.round(avg/1000))}</div><div class="d">t / cliente (${(avg/24000).toFixed(1).replace('.',',')} ctnr)</div></div>`;
  const tb=document.getElementById('tb');
  tb.innerHTML=r.map((o,i)=>{const x=o.x,vol=o.vol,ns=effNcms(x);return `<tr>
    <td class="rank">${i+1}</td>
    <td><b>${x.c}</b>${x.polB?'<br><span class="pol">poliamida não atendível — desconsiderada</span>':''}</td>
    <td>${x.city||'—'}</td>
    <td>${x.uf||'—'}</td>
    <td><span class="st">${x.st}</span></td>
    <td class="n">${fmt(Math.round(vol/1000))}</td>
    <td class="n">${fmt(vol/24000)}</td>
    <td>${ns.slice(0,4).map(n=>`<span class="tag">${n[0].replace(/ \(\d+\)/,'')} · ${fmt(Math.round(n[1]/1000))}t</span>`).join('')}${ns.length>4?'<span class="tag">+'+(ns.length-4)+'</span>':''}</td>
    <td class="cmp">${x.exp.slice(0,3).map(e=>e[0]).join(' · ')||'—'}</td>
  </tr>`;}).join('');
  document.getElementById('foot').innerHTML=`Mostrando <b>${fmt(r.length)}</b> clientes · Total <b>${fmt(Math.round(tot/1000))} t</b> ≈ <b>${fmt(ctnr)} ctnr</b>${ncmOn?' <b>(somente a(s) NCM(s) selecionada(s))</b>':''}. &nbsp;|&nbsp; Status "Não Superia (prospect)" = importadores sem nenhum volume fornecido pela SUPERIA na janela. Cliente = Notificado quando informado, senão Provável Importador. Excluídos totalmente da conta: HYOSUNG, VENTUNO, UNIFI, HUVISPAN (produtores/concorrentes). <b>Regra Poliamida (NCM 5402.31.19):</b> o volume de poliamida foi <b>desconsiderado</b> para clientes que não podemos atender em poliamida (carteira Ventuno/Superia e distribuidoras) — as demais NCMs desses clientes permanecem, pois podem ser prospectadas.`;
}
document.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k.startsWith('_'))return;if(sK===k)sD=-sD;else{sK=k;sD=(k==='c'||k==='city'||k==='uf'||k==='st')?1:-1;}render();});
document.getElementById('q').oninput=render;
document.getElementById('clr').onclick=()=>{Object.values(SEL).forEach(s=>s.clear());document.getElementById('q').value='';buildFilters();render();};
document.getElementById('xls').onclick=()=>{
  const ncmOn=SEL.ncm.size>0;
  const r=filtered().map(x=>({x,vol:effKg(x)})).sort((a,b)=>b.vol-a.vol);
  const aoa=[['#','Cliente','Cidade','UF','Status',ncmOn?'Vol NCM selec. (t)':'Vol 12m (t)','ctnr','NCMs (linhas)','Poliamida desconsiderada','Principais concorrentes']];
  r.forEach((o,i)=>{const x=o.x,vol=o.vol,ns=effNcms(x);aoa.push([i+1,x.c,x.city,x.uf,x.st,Math.round(vol),Math.round(vol/24000),ns.map(n=>n[0]).join(' | '),x.polB?'Sim':'Não',x.exp.map(e=>e[0]).join(' | ')]);});
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:5},{wch:44},{wch:18},{wch:5},{wch:22},{wch:14},{wch:8},{wch:40},{wch:12},{wch:44}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Prospects');
  XLSX.writeFile(wb,'SUPERIA_prospects_novo_trader_12m.xlsx');
};
function buildFilters(){
  ms('msCli','Cliente',D.rows.map(r=>r.c).slice().sort(),SEL.cli,render);
  ms('msUf','UF',D.ufs,SEL.uf,render);
  ms('msCid','Cidade',D.cities,SEL.cid,render);
  ms('msNcm','NCM',D.ncms,SEL.ncm,render,fmtNcm);
  ms('msComp','Concorrente',D.comps,SEL.comp,render);
}
buildFilters();render();
